name: Weekly Quote Processing

on:
  schedule:
    # Run every Sunday at 12:00 UTC
    - cron: '0 12 * * 0'
  workflow_dispatch: # Allow manual triggering

jobs:
  process-quotes:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v3
        with:
          node-version: '18'

      - name: Check for pending quotes branch
        id: check-branch
        run: |
          if git ls-remote --heads origin pending-quotes | grep -q pending-quotes; then
            echo "branch_exists=true" >> $GITHUB_OUTPUT
          else
            echo "branch_exists=false" >> $GITHUB_OUTPUT
          fi

      - name: Create and switch to pending-quotes branch
        if: steps.check-branch.outputs.branch_exists == 'false'
        run: |
          git checkout -b pending-quotes
          git push origin pending-quotes

      - name: Switch to pending-quotes branch
        if: steps.check-branch.outputs.branch_exists == 'true'
        run: |
          git checkout pending-quotes
          git pull origin pending-quotes

      - name: Check for pending quotes to process
        id: check-pending
        run: |
          if [ -f "pending-quotes.json" ] && [ "$(cat pending-quotes.json)" != "[]" ]; then
            echo "has_pending=true" >> $GITHUB_OUTPUT
            echo "Pending quotes found"
          else
            echo "has_pending=false" >> $GITHUB_OUTPUT
            echo "No pending quotes to process"
          fi

      - name: Process pending quotes
        if: steps.check-pending.outputs.has_pending == 'true'
        run: |
          # Install jq for JSON processing
          sudo apt-get update && sudo apt-get install -y jq
          
          # Validate pending quotes JSON
          if ! jq empty pending-quotes.json; then
            echo "pending-quotes.json is not valid JSON"
            exit 1
          fi
          
          # Get pending quotes count
          PENDING_COUNT=$(jq length pending-quotes.json)
          echo "Found $PENDING_COUNT pending quotes"
          
          if [ "$PENDING_COUNT" -gt 0 ]; then
            # Backup current quotes
            cp Quotes.json Quotes.backup.json
            
            # Merge pending quotes into main quotes file
            jq '. + input' Quotes.json pending-quotes.json > Quotes.temp.json
            mv Quotes.temp.json Quotes.json
            
            # Clear pending quotes
            echo "[]" > pending-quotes.json
            
            # Validate final JSON
            if ! jq empty Quotes.json; then
              echo "Final Quotes.json is not valid JSON, restoring backup"
              mv Quotes.backup.json Quotes.json
              exit 1
            fi
            
            # Configure git
            git config user.name "Quote Bot"
            git config user.email "bot@example.com"
            
            # Commit changes
            git add Quotes.json pending-quotes.json
            git commit -m "Automated: Added $PENDING_COUNT new quotes"
            
            # Push changes
            git push origin pending-quotes
            
            echo "Successfully processed $PENDING_COUNT quotes"
          fi

      - name: Create Pull Request
        if: steps.check-pending.outputs.has_pending == 'true'
        uses: peter-evans/create-pull-request@v5
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          branch: pending-quotes
          base: main
          title: 'Weekly Quote Update'
          body: |
            ## Weekly Quote Processing
            
            This PR contains new quotes that have been submitted and validated.
            
            - Quotes processed and validated
            - JSON format verified
            - Ready for review and merge
            
            Auto-generated by the weekly quote processing workflow.
          draft: false

      - name: Auto-merge if safe
        if: steps.check-pending.outputs.has_pending == 'true'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Get the PR number (this is a simplified approach)
          # In a real scenario, you might want to use the PR API to get the exact PR
          echo "PR created - manual review recommended before merge"
          echo "Automated merging can be enabled by adding auto-merge logic here"