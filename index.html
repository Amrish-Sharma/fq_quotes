<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Random Quote Generator</title>
    <link rel="stylesheet" href="styles.css">
    <script src="script.js" defer></script>
    <style>
        body {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            margin: 0;
            padding: 20px;
            font-family: Arial, sans-serif;
            background: #f0f0f0;
            box-sizing: border-box;
        }
        .container {
            background: white;
            padding: 20px;
            border-radius: 10px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            max-width: 600px;
            text-align: center;
            margin: 20px;
        }
        #quote-container {
            margin-bottom: 20px;
        }
        blockquote {
            font-size: 1.5em;
            margin: 0;
            color: #333;
        }
        cite {
            display: block;
            margin-top: 10px;
            font-size: 1.2em;
            color: #555;
        }
        .theme {
            display: block;
            margin-top: 5px;
            font-size: 1em;
            color: #888;
            font-style: italic;
        }
        .form-container {
            text-align: left;
        }
        .form-container h2 {
            text-align: center;
            color: #333;
        }
        .form-group {
            margin-bottom: 15px;
        }
        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #555;
            font-weight: bold;
        }
        .form-group input, .form-group textarea, .form-group select {
            width: 100%;
            padding: 8px;
            border: 1px solid #ddd;
            border-radius: 4px;
            font-size: 14px;
        }
        .form-group textarea {
            resize: vertical;
            height: 80px;
        }
        .submit-btn {
            background: #007bff;
            color: white;
            padding: 10px 20px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        .submit-btn:hover {
            background: #0056b3;
        }
        .toggle-btn {
            background: #28a745;
            color: white;
            padding: 8px 16px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            margin-bottom: 20px;
        }
        .toggle-btn:hover {
            background: #1e7e34;
        }
        .hidden {
            display: none;
        }
        .success-message {
            background: #d4edda;
            color: #155724;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 15px;
            border: 1px solid #c3e6cb;
        }
    </style>
</head>
<body>
    <div class="container" id="quote-container">
        <blockquote id="quote">Loading...</blockquote>
        <cite id="author"></cite>
        <span class="theme" id="theme"></span>
        <button class="toggle-btn" onclick="getRandomQuote()">Get New Quote</button>
    </div>
    
    <button class="toggle-btn" onclick="toggleForm()">Submit a Quote</button>
    
    <div class="container form-container hidden" id="submission-form">
        <h2>Submit a New Quote</h2>
        <div id="success-message" class="success-message hidden"></div>
        <form id="quote-form">
            <div class="form-group">
                <label for="quote-input">Quote:</label>
                <textarea id="quote-input" name="quote" required placeholder="Enter the quote text..."></textarea>
            </div>
            <div class="form-group">
                <label for="author-input">Author:</label>
                <input type="text" id="author-input" name="author" required placeholder="Enter author name...">
            </div>
            <div class="form-group">
                <label for="theme-input">Theme:</label>
                <select id="theme-input" name="theme" required>
                    <option value="">Select a theme...</option>
                    <option value="Success">Success</option>
                    <option value="Wisdom">Wisdom</option>
                    <option value="Unity">Unity</option>
                    <option value="Perseverance">Perseverance</option>
                    <option value="Personal Responsibility">Personal Responsibility</option>
                    <option value="Love">Love</option>
                    <option value="Life">Life</option>
                    <option value="Motivation">Motivation</option>
                    <option value="Leadership">Leadership</option>
                    <option value="Friendship">Friendship</option>
                    <option value="Happiness">Happiness</option>
                    <option value="Change">Change</option>
                    <option value="Dreams">Dreams</option>
                    <option value="Courage">Courage</option>
                    <option value="Other">Other</option>
                </select>
            </div>
            <button type="submit" class="submit-btn">Submit Quote</button>
        </form>
    </div>
</body>
</html>
